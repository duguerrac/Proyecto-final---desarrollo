# NATS Server Configuration for SmartLogistics
# WebSocket enabled for Unreal Engine simulation

server_name: "smartlogistic-nats"

# Client connections
port: 4222

# Monitoring
http_port: 8222

# WebSocket for Unreal Engine
websocket {
    port: 8443
    no_tls: true
}

# JetStream for persistence
jetstream {
    store_dir: "/data"
}