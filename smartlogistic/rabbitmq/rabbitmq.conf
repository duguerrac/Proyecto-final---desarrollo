## RabbitMQ Web STOMP Configuration
## This ensures the Web STOMP plugin listens on port 15674

## Web STOMP listener
web_stomp.listener.port = 15674
web_stomp.listener.bind_address = 0.0.0.0

## Allow WebSocket connections from any origin (development only)
web_stomp.cowboy_opts.max_header_value_size = 65536

## Default user/tags
default_user = guest
default_pass = guest