## RabbitMQ configuration
## Web STOMP plugin settings for 3.13

# Default credentials via RABBITMQ_DEFAULT_USER/PASS env vars in docker-compose

## Web STOMP plugin — increase Cowboy idle timeout to prevent premature WebSocket disconnects.
## Default is 60000ms (60s). Setting to 600000ms (10 min) to tolerate network hiccups and GC pauses.
## The STOMP heartbeat (negotiated at 30s) keeps the connection alive at the protocol level,
## but Cowboy also has its own idle timeout at the TCP level.
web_stomp.cowboy_opts.idle_timeout = 600000

## Increase the Web STOMP max frame size to handle larger messages (default 4MB)
web_stomp.ws_opts.max_frame_size = 41943040