services:

  # ─────────────────────────────
  # Fase A: Foundation — Bases de datos y Broker
  # ─────────────────────────────

  warehouse-db:
    image: postgres:16-alpine
    container_name: smartlogistic-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse_db}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/seed-warehouse.sql:/docker-entrypoint-initdb.d/seed-warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smartlogistic-net

  robot-redis:
    image: redis:7-alpine
    container_name: smartlogistic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smartlogistic-net

  analytics-db:
    image: mongo:7-jammy
    container_name: smartlogistic-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-logistics_analytics}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smartlogistic-net

  nats:
    image: nats:2.10-alpine
    container_name: smartlogistic-nats
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_HTTP_PORT:-8222}:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smartlogistic-net

  # ─────────────────────────────
  # Fase E: Nginx Gateway
  # ─────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: smartlogistic-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ms-warehouse-core
    networks:
      - smartlogistic-net

  # ─────────────────────────────
  # Fase C: MS-WarehouseCore
  # ─────────────────────────────

  ms-warehouse-core:
    build:
      context: .
      dockerfile: ms-warehouse-core/Dockerfile
    container_name: smartlogistic-warehouse-core
    restart: unless-stopped
    ports:
      - "${WAREHOUSE_CORE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://warehouse-db:5432/${POSTGRES_DB:-warehouse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-warehouse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-warehouse_pass}
      ROBOT_STATUS_URL: http://ms-robot-status:8082
      NATS_URL: nats://nats:4222
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,info
    depends_on:
      warehouse-db:
        condition: service_healthy
      ms-robot-status:
        condition: service_started
      nats:
        condition: service_healthy
    networks:
      - smartlogistic-net

  # ─────────────────────────────
  # Fase B: MS-RobotStatus
  # ─────────────────────────────

  ms-robot-status:
    build:
      context: .
      dockerfile: ms-robot-status/Dockerfile
    container_name: smartlogistic-robot-status
    restart: unless-stopped
    ports:
      - "${ROBOT_STATUS_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_REDIS_HOST: robot-redis
      SPRING_REDIS_PORT: 6379
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,info
    depends_on:
      robot-redis:
        condition: service_healthy
    networks:
      - smartlogistic-net

  # ─────────────────────────────
  # Fase D: MS-LogisticsAnalytics
  # ─────────────────────────────

  ms-logistics-analytics:
    build:
      context: .
      dockerfile: ms-logistics-analytics/Dockerfile
    container_name: smartlogistic-analytics
    restart: unless-stopped
    ports:
      - "${ANALYTICS_PORT:-8083}:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_MONGODB_URI: mongodb://analytics-db:27017/${MONGO_DB:-logistics_analytics}
      NATS_URL: nats://nats:4222
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,info
    depends_on:
      analytics-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - smartlogistic-net

  # ─────────────────────────────
  # Fase F: Observabilidad
  # ─────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: smartlogistic-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - ms-warehouse-core
      - ms-robot-status
      - ms-logistics-analytics
    networks:
      - smartlogistic-net

  grafana:
    image: grafana/grafana:latest
    container_name: smartlogistic-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - smartlogistic-net

  loki:
    image: grafana/loki:latest
    container_name: smartlogistic-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    networks:
      - smartlogistic-net

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  smartlogistic-net:
    driver: bridge
