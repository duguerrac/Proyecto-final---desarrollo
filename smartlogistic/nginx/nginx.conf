events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $identity_upstream http://ms-identity:8084;
        set $warehouse_upstream http://ms-warehouse-core:8081;

        # Rutas públicas — sin autenticación
        location /api/auth/ {
            proxy_pass $identity_upstream;
        }

        # Endpoint interno de validación JWT (auth_request)
        location = /api/auth/validate {
            internal;
            proxy_method POST;
            proxy_pass $identity_upstream/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # Rutas protegidas — requieren JWT válido
        location /api/ {
            auth_request /api/auth/validate;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            proxy_set_header X-Auth-User $auth_user;
            proxy_pass $warehouse_upstream;
        }

        # Health check para Nginx
        location /health {
            default_type text/plain;
            return 200 "OK\n";
        }
    }
}
