events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 80;

        # CORS headers for cross-origin requests (dev: any localhost port)
        # Use $http_origin to support any dev server port (3000, 3001, 3002, etc.)
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Auth-User" always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $identity_upstream http://ms-identity:8084;
        set $warehouse_upstream http://ms-warehouse-core:8081;
        set $robot_status_upstream http://ms-robot-status:8082;

        # Rutas públicas — sin autenticación
        location /api/auth/ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Auth-User" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            proxy_pass $identity_upstream;
        }

        # Endpoint interno de validación JWT (auth_request)
        location = /api/auth/validate {
            internal;
            proxy_method POST;
            
            # For SSE: EventSource can't set headers, so token comes as query param
            set $auth_value $http_authorization;
            if ($http_authorization = "") {
                set $auth_value "Bearer $arg_token";
            }
            
            proxy_pass $identity_upstream/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $auth_value;
        }

        # Handle CORS preflight for all API routes
        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Auth-User" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            auth_request /api/auth/validate;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            proxy_set_header X-Auth-User $auth_user;
            proxy_pass $warehouse_upstream;
        }

        # SSE package stream — no auth (EventSource can't send headers), read-only
        location /api/packages/stream {
            # Handle CORS preflight for SSE
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
            proxy_pass $warehouse_upstream;
        }

        # SSE telemetry stream — no auth (EventSource can't send headers), read-only
        location /api/robots/telemetry/stream {
            # Handle CORS preflight for SSE
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
            proxy_pass $robot_status_upstream;
        }

        # Pending missions — no auth (UE5 HTTP polling fallback, read-only)
        location /api/robots/pending-missions {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            proxy_pass $robot_status_upstream;
        }

        # Clear pending mission — no auth (UE5 confirms mission processed)
        location ~ ^/api/robots/[^/]+/pending-mission$ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            proxy_pass $robot_status_upstream;
        }

        # SSE order stream — no auth (EventSource can't send headers), read-only
        location /api/orders/stream {
            # Handle CORS preflight for SSE
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
            proxy_pass $warehouse_upstream;
        }

        # Robot status endpoints — protected, proxied to ms-robot-status
        # Note: no trailing slash so both /api/robots and /api/robots/... match
        location /api/robots {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Auth-User" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            auth_request /api/auth/validate;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            proxy_set_header X-Auth-User $auth_user;
            proxy_pass $robot_status_upstream;
        }

        # Health check para Nginx
        location /health {
            default_type text/plain;
            return 200 "OK\n";
        }
    }
}
